# stagehand configuration — this file IS the demo.
# Demo identity + defaults first, then the golden image recipe.

# Machine names derive from this (`atomic-demo-1`, `atomic-demo-2`, …).
# Drop it and the demo.toml directory name is used instead.
name = "atomic-demo"

port = 8410                       # ALWAYS http://localhost:8410
# include = ["/path/to/repo"]     # folders COPIED into the VM at `stagehand new`
#                                 # time — fresh copy every run, the host
#                                 # original is never mounted or modified

[defaults]
guest_port = 8080                 # port the webapp listens on inside the VM

# Credentials bound HOST-SIDE: the VM only ever sees a SMOLPLACEHOLDER_*
# value; smolvm substitutes the real value from your shell env on HTTPS
# requests to the hosts listed below. The secret never enters the VM.
#
# List EVERY host the credential is actually sent to — requests to any
# host not listed pass through with the placeholder unchanged (and would
# fail auth). The host must match what the client really connects to,
# e.g. OpenRouter's API host is "openrouter.ai".
#
# Set the var in your shell when a machine is STARTED.
[defaults.credentials.OPENROUTER_API_KEY]
hosts = ["openrouter.ai"]

# Add more bindings as needed, e.g.:
# [defaults.credentials.ANTHROPIC_API_KEY]
# hosts = ["api.anthropic.com"]

# For secrets that must be plainly visible inside the VM (non-HTTPS use):
# secret_env = ["SOME_PLAIN_TOKEN"]
# net = true                      # outbound networking (default true)
# ssh_agent = true                # forward your SSH agent for git push/pull (default true)

# The golden image: assembled by `stagehand build`, cloned into every demo VM.
[build]
image = "debian:bookworm-slim"

# What `stagehand new` lands in — unset means a plain shell.
# Set to "opencode" (or any harness in tools) to drop straight into it.
# entrypoint = "opencode"

# Demo toolchains via mise; every binary lands on PATH through mirrored shims.
# node is required by opencode 2.x (npm package postinstall).
# atomic comes prebuilt from the aqua registry — no cross-compile needed.
tools = ["node@lts", "opencode@latest", "go@latest", "rust@stable", "aqua:atomicdotdev/atomic@0.20.0"]

# Distro packages in the image; build-essential provides cc so cargo can link.
packages = [
  "ca-certificates", "curl", "git", "jq", "less", "ripgrep", "unzip",
  "build-essential",
]

# Wire opencode to atomic: the hooks install into ~/.config/opencode (global),
# which persists in the golden image. `agent enable` needs a repo root, so
# smoke-init one in /tmp first (that repo itself is throwaway).
#
# NOTE: until atomic-skills' release view carries atomic-integration.toml
# (it's currently only on dev), enable falls back to built-in hooks — the
# `|| true` lets the golden build finish with hooks but no skills/prompt.
# Remove the fallback once the skills package is fixed.
setup = """
set -eu
rm -rf /tmp/atomic-smoke
mkdir -p /tmp/atomic-smoke && cd /tmp/atomic-smoke
atomic init
atomic agent enable --agent opencode --force || \
  echo "WARNING: partial agent enable — hooks installed, skills/system-prompt missing"
atomic agent status || true
"""

