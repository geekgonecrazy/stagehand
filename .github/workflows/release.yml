name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN: stagehand

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }   # macOS Apple Silicon
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          # aarch64 musl isn't self-contained; pure-Rust links fine with rust-lld
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, ld: "-C linker=rust-lld" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.ld }}
      - name: package
        run: |
          dir="stagehand-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/$BIN" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: stagehand-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
